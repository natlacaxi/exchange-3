<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TalcoExchange | Talco-IT-Networks</title>
<meta name="description" content="Le réseau social de messagerie du GroupeTalco.">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{color-scheme:light dark;--bg:#f4f6fb;--card:#ffffffd9;--tx:#0f172a;--mu:#64748b;--bd:#e2e8f0;--ac:#2563eb;--rd:#dc2626;--ok:#16a34a;--in:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#131c2ed9;--tx:#e2e8f0;--mu:#94a3b8;--bd:#24304a;--ac:#60a5fa;--rd:#f87171;--ok:#4ade80;--in:#0f1727}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bg);visibility:hidden}
#frame.on{visibility:visible}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:radial-gradient(60% 50% at 15% 10%,#60a5fa44,transparent),radial-gradient(50% 45% at 90% 90%,#a78bfa44,transparent),var(--bg)}
.hidden{display:none!important}
#splash img{width:84px;height:84px;border-radius:22px;animation:p 1.4s ease-in-out infinite}
@keyframes p{50%{transform:scale(.92);opacity:.7}}
.card{width:100%;max-width:420px;margin:auto;background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--bd);border-radius:24px;padding:22px 20px;box-shadow:0 20px 50px #0002}
.card .logo{display:block;width:64px;height:64px;border-radius:16px;margin:0 auto 8px}
h1{font-size:1.45rem;text-align:center;margin:.1em 0}
.sub{text-align:center;color:var(--mu);margin:0 0 14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bd);border-radius:12px;padding:4px;margin-bottom:14px}
.tabs button{border:0;background:transparent;color:var(--tx);border-radius:9px;padding:10px;font:inherit;min-height:44px;cursor:pointer}
.tabs button.on{background:var(--in);font-weight:600;box-shadow:0 1px 4px #0002}
form{display:none;gap:10px;flex-direction:column}form.on{display:flex}
label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--mu)}
input{font:inherit;font-size:16px;color:var(--tx);background:var(--in);border:1px solid var(--bd);border-radius:12px;padding:12px;min-height:46px;width:100%}
input:focus{outline:2px solid var(--ac);outline-offset:0}
.chk{flex-direction:row;align-items:flex-start;gap:8px;color:var(--tx);font-size:.85rem}.chk input{width:20px;min-height:20px;margin-top:2px}
.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:13px;min-height:48px;background:var(--ac);color:#fff;cursor:pointer}
.btn:disabled{opacity:.5}
.lnk{background:none;border:0;color:var(--ac);font:inherit;padding:6px;cursor:pointer;min-height:36px}
#msg{display:none;border-radius:10px;padding:10px 12px;font-size:.9rem;margin-bottom:10px}
#msg.bad{display:block;background:#dc262615;color:var(--rd)}#msg.ok{display:block;background:#16a34a15;color:var(--ok)}
.foot{text-align:center;color:var(--mu);font-size:.78rem;margin-top:12px}.foot a{color:inherit}
</style>
</head>
<body>

<iframe id="frame" title="TalcoExchange" allow="camera; microphone; clipboard-write; autoplay; fullscreen; web-share" referrerpolicy="origin"></iframe>

<div id="splash" class="screen"><img src="icon-192.png" alt="TalcoExchange"></div>

<div id="login" class="screen hidden">
  <div class="card">
    <img class="logo" src="icon-192.png" alt="">
    <h1>TalcoExchange</h1>
    <p class="sub">Discutez en temps réel avec vos amis.</p>
    <div class="tabs">
      <button type="button" class="on" data-t="in">Connexion</button>
      <button type="button" data-t="up">Créer un compte</button>
    </div>
    <div id="msg" role="status"></div>

    <form id="fin" class="on" autocomplete="on">
      <label>Pseudo ou e-mail<input id="lid" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required></label>
      <label>Mot de passe<input id="lpw" type="password" autocomplete="current-password" required></label>
      <button class="btn" type="submit">Se connecter</button>
      <button class="lnk" type="button" id="forgot">Mot de passe oublié ?</button>
      <button class="lnk hidden" type="button" id="resend">Renvoyer le mail de validation</button>
    </form>

    <form id="fup" autocomplete="on">
      <label>Code d’invitation<input id="sinv" inputmode="numeric" autocomplete="off" required></label>
      <label>Prénom<input id="spre" autocomplete="given-name" required></label>
      <label>Nom<input id="snom" autocomplete="family-name" required></label>
      <label>Pseudo<input id="sps" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="20" required></label>
      <label>Téléphone<input id="stel" type="tel" autocomplete="tel" required></label>
      <label>E-mail<input id="smail" type="email" autocomplete="email" required></label>
      <label>Mot de passe (8 caractères minimum)<input id="sp1" type="password" autocomplete="new-password" required></label>
      <label>Confirmer le mot de passe<input id="sp2" type="password" autocomplete="new-password" required></label>
      <label class="chk"><input type="checkbox" id="sterms"><span>J’ai lu et j’accepte les <a href="legal.html#cgu" target="_blank" rel="noopener">conditions d’utilisation</a> et la <a href="legal.html#priv" target="_blank" rel="noopener">politique de confidentialité</a>.</span></label>
      <button class="btn" type="submit">Créer mon compte</button>
    </form>

    <div class="foot"><a href="legal.html#legal" target="_blank" rel="noopener">Mentions légales</a><br>© TalcoInc2026 — GroupeTalco</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, setPersistence, inMemoryPersistence, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendEmailVerification, sendPasswordResetEmail, signOut, deleteUser }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getDatabase, ref, get, update, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

/* ===== Réglages ===== */
/* Adresse (secrète) de l’interface Exchange : hébergée sur un autre compte GitHub Pages. */
const INTERFACE_URL = "https://talcoitn-k9x2mp7vl4wq6ty1hb5jn3rd8fk4sz.github.io/exchange-3-a8f4k92m7p1x5v3n6q8w2z9c4b7j0h5r2t8y6u3i1o9l4s7d0g2e5a8c1v4b7n9m2q5w8e3r6t9y1u4i7o0p2a5s8/";
const IORIGIN = new URL(INTERFACE_URL).origin;

/* Serveur principal : comptes du portail (itn-2). */
const C2 = {
  apiKey: "AIzaSyABc0-3-D4kTgnH4-He_yEO8km45ah0BqY", authDomain: "itn-2-fa6a9.firebaseapp.com",
  databaseURL: "https://itn-2-fa6a9-default-rtdb.europe-west1.firebasedatabase.app", projectId: "itn-2-fa6a9",
  appId: "1:599829214627:web:a82b6c70638db8ddda1616"
};
/* Serveur Exchange (itn-3). */
const C3 = {
  apiKey: "AIzaSyALu9n3ksX-0mN4u8reRBpFkWAUsVsGswA", authDomain: "itn-3-1b09f.firebaseapp.com",
  databaseURL: "https://itn-3-1b09f-default-rtdb.europe-west1.firebasedatabase.app", projectId: "itn-3-1b09f",
  appId: "1:105336373207:web:238065cbea49453d4d1592"
};

const $ = s => document.querySelector(s);
const PSEUDO = /^[a-z0-9_-]{3,20}$/, TEL = /^\+?[0-9 .-]{6,20}$/, MAIL = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const frame = $("#frame");

/* Sessions de cette page : en mémoire seulement (rien n’est gardé ici, l’interface garde la sienne). */
const app2 = initializeApp(C2, "l2"), a2 = getAuth(app2), db2 = getDatabase(app2);
const app3 = initializeApp(C3, "l3"), a3 = getAuth(app3), db3 = getDatabase(app3);
await Promise.all([setPersistence(a2, inMemoryPersistence), setPersistence(a3, inMemoryPersistence)]);

/* ===== Serveurs : à chaque nouveau compte, il est créé sur tous les serveurs de cette liste.
   Pour en ajouter un (itn-4, itn-5…), ajouter une entrée { name, ensure } avec sa propre fonction. ===== */
async function ensureExchange(email, pw, prof) {
  let cred;
  try { cred = await signInWithEmailAndPassword(a3, email, pw); }
  catch (e) {
    if (!/user-not-found|invalid-credential|invalid-login/.test(e?.code || "")) throw e;
    try { cred = await createUserWithEmailAndPassword(a3, email, pw); }
    catch (e2) { if (/email-already-in-use/.test(e2?.code || "")) throw { code: "x/desync" }; throw e2; }
  }
  const uid = cred.user.uid;
  if (!(await get(ref(db3, "users/" + uid))).exists()) {
    const id = prof.pseudo, name = (((prof.prenom || "") + " " + (prof.nom || "")).trim() || id).slice(0, 40);
    await update(ref(db3), { ["users/" + uid]: { id, idLower: id, name, createdAt: serverTimestamp(), terms: 1 }, ["idIndex/" + id]: uid });
  }
  await signOut(a3);
}
const SERVERS = [{ name: "itn-3 (Exchange)", ensure: ensureExchange, auth: a3 }];
const provision = async (email, pw, prof) => { for (const s of SERVERS) await s.ensure(email, pw, prof); };

/* ===== Affichage ===== */
let ready = false, slowT;
const showApp = () => { ready = true; clearTimeout(slowT); frame.classList.add("on"); $("#splash").classList.add("hidden"); $("#login").classList.add("hidden"); };
const showCard = () => { ready = false; frame.classList.remove("on"); $("#splash").classList.add("hidden"); $("#login").classList.remove("hidden"); };
const msg = (t, ok) => { const m = $("#msg"); m.textContent = t || ""; m.className = t ? (ok ? "ok" : "bad") : ""; };
const busy = (f, b) => f.querySelectorAll("button,input").forEach(x => x.disabled = b);
const authErr = e => ({
  "auth/invalid-credential": "Identifiants incorrects.", "auth/wrong-password": "Identifiants incorrects.", "auth/user-not-found": "Identifiants incorrects.",
  "auth/invalid-email": "Adresse e-mail invalide.", "auth/email-already-in-use": "Cette adresse e-mail est déjà utilisée.", "auth/weak-password": "Mot de passe trop faible.",
  "auth/too-many-requests": "Trop de tentatives. Réessayez dans quelques minutes.", "auth/network-request-failed": "Problème de réseau. Vérifiez votre connexion.",
  "x/desync": "Le mot de passe Exchange n’est plus synchronisé avec celui du compte. Utilisez « Mot de passe oublié ? »."
})[e && e.code] || (/PERMISSION_DENIED/i.test(e?.message || "") ? "Accès refusé par le serveur (identifiant déjà pris ?)." : "Une erreur est survenue. Réessayez.");

document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
  $("#fin").classList.toggle("on", b.dataset.t === "in"); $("#fup").classList.toggle("on", b.dataset.t === "up");
  msg(""); $("#resend").classList.add("hidden");
});

/* ===== Liaison avec l’interface (autre domaine : uniquement par messages) ===== */
frame.src = INTERFACE_URL;
slowT = setTimeout(() => { if (!ready) showCard(); }, 12000);
const toFrame = m => frame.contentWindow.postMessage(m, IORIGIN);
let dip = null, waitT;
addEventListener("message", e => {
  if (e.origin !== IORIGIN || e.source !== frame.contentWindow) return;
  const m = e.data || {};
  if (m.type === "exchange-ready") { clearTimeout(waitT); showApp(); if (dip) toFrame({ type: "exchange-install-ready" }); }
  else if (m.type === "exchange-need-login") { clearTimeout(slowT); clearTimeout(waitT); showCard(); }
  else if (m.type === "exchange-login-error") { clearTimeout(waitT); showCard(); msg(m.message || "Connexion impossible."); }
  else if (m.type === "exchange-install" && dip) { dip.prompt(); dip.userChoice.catch(() => {}).finally(() => { dip = null; }); }
});
addEventListener("beforeinstallprompt", e => { e.preventDefault(); dip = e; if (ready) toFrame({ type: "exchange-install-ready" }); });
addEventListener("appinstalled", () => { dip = null; if (frame.contentWindow) toFrame({ type: "exchange-installed" }); });
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));

/* ===== Connexion ===== */
let pending = null;
$("#fin").onsubmit = async e => {
  e.preventDefault(); msg(""); $("#resend").classList.add("hidden");
  const id = $("#lid").value.trim().toLowerCase(), pw = $("#lpw").value;
  if (!id || !pw) return msg("Renseignez votre pseudo et votre mot de passe.");
  busy(e.target, true);
  try {
    let email = id;
    if (!id.includes("@")) {
      if (!PSEUDO.test(id)) throw { code: "auth/invalid-credential" };
      const s = await get(ref(db2, "pseudos/" + id));
      if (!s.exists() || !s.val().email) throw { code: "auth/invalid-credential" };
      email = s.val().email;
    }
    const u = (await signInWithEmailAndPassword(a2, email, pw)).user;
    if (!u.emailVerified) { pending = u; $("#resend").classList.remove("hidden"); return msg("Adresse e-mail non validée. Cliquez sur le lien reçu par mail, puis reconnectez-vous."); }
    const p = await get(ref(db2, "users/" + u.uid));
    if (!p.exists()) { await signOut(a2); return msg("Compte incomplet. Recréez votre compte avec un code d’invitation valide."); }
    await provision(email, pw, p.val());               // crée / répare le compte sur les autres serveurs
    await signOut(a2);
    msg("Connexion…", true);
    $("#lpw").value = "";
    waitT = setTimeout(() => { showCard(); msg("L’interface met trop de temps à répondre. Réessayez."); busy($("#fin"), false); }, 20000);
    toFrame({ type: "exchange-login", email, password: pw });
    return;
  } catch (er) { msg(authErr(er)); }
  finally { busy(e.target, false); }
};
$("#resend").onclick = async () => {
  if (!pending) return;
  try { await sendEmailVerification(pending); msg("Mail de validation renvoyé. Pensez à vérifier vos spams.", true); }
  catch (er) { msg(authErr(er)); }
  $("#resend").classList.add("hidden"); try { await signOut(a2); } catch (x) {} pending = null;
};
$("#forgot").onclick = async () => {
  msg("");
  const id = $("#lid").value.trim().toLowerCase();
  if (!id) return msg("Saisissez votre pseudo ou votre e-mail ci-dessus.");
  try {
    let email = id;
    if (!id.includes("@")) {
      const s = PSEUDO.test(id) ? await get(ref(db2, "pseudos/" + id)) : null;
      if (s && s.exists()) email = s.val().email; else return msg("Si le compte existe, un mail de réinitialisation a été envoyé.", true);
    }
    await sendPasswordResetEmail(a2, email);
    for (const s of SERVERS) { try { await sendPasswordResetEmail(s.auth, email); } catch (x) {} }
    msg("Si le compte existe, des mails de réinitialisation ont été envoyés (un par serveur). Choisissez le même mot de passe dans chacun.", true);
  } catch (er) { msg(authErr(er)); }
};

/* ===== Inscription : crée le compte sur le serveur principal puis sur tous les autres ===== */
$("#fup").onsubmit = async e => {
  e.preventDefault(); msg("");
  const code = $("#sinv").value.trim(), prenom = $("#spre").value.trim(), nom = $("#snom").value.trim(),
    pseudo = $("#sps").value.trim().toLowerCase(), tel = $("#stel").value.trim(),
    email = $("#smail").value.trim().toLowerCase(), p1 = $("#sp1").value, p2 = $("#sp2").value;
  if (!code) return msg("Le code d’invitation est obligatoire.");
  if (!prenom || !nom) return msg("Prénom et nom obligatoires.");
  if (!PSEUDO.test(pseudo)) return msg("Pseudo invalide (3 à 20 caractères : a-z, 0-9, _ ou -).");
  if (!TEL.test(tel)) return msg("Numéro de téléphone invalide.");
  if (!MAIL.test(email)) return msg("Adresse e-mail invalide.");
  if (p1.length < 8) return msg("Le mot de passe doit contenir au moins 8 caractères.");
  if (p1 !== p2) return msg("Les deux mots de passe ne correspondent pas.");
  if (!$("#sterms").checked) return msg("Vous devez accepter les conditions pour créer un compte.");
  busy(e.target, true);
  let u = null;
  try {
    if ((await get(ref(db2, "pseudos/" + pseudo))).exists()) return msg("Ce pseudo est déjà pris.");
    u = (await createUserWithEmailAndPassword(a2, email, p1)).user;
    /* Profil + pseudo en une seule écriture ; le code d’invitation est vérifié par les règles du serveur. */
    try { await update(ref(db2), { ["users/" + u.uid]: { prenom, nom, tel, email, pseudo, invite: code, createdAt: serverTimestamp() }, ["pseudos/" + pseudo]: { uid: u.uid, email } }); }
    catch (er) { await deleteUser(u).catch(() => {}); u = null; return msg("Code d’invitation invalide (ou pseudo déjà pris)."); }
    await sendEmailVerification(u);
    try { await provision(email, p1, { prenom, nom, pseudo }); } catch (x) { /* réparé automatiquement à la 1re connexion */ }
    await signOut(a2); u = null;
    e.target.reset();
    document.querySelector('.tabs button[data-t="in"]').click();
    msg("Compte créé ! Un mail de validation vient d’être envoyé à " + email + ". Cliquez sur le lien, puis connectez-vous.", true);
  } catch (er) { if (u) await deleteUser(u).catch(() => {}); msg(authErr(er)); }
  finally { busy(e.target, false); }
};
</script>
<noscript><p style="padding:20px;font-family:sans-serif">JavaScript est nécessaire pour utiliser TalcoExchange.</p></noscript>
</body>
</html>
